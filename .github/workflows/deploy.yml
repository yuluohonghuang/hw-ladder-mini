name: Auto Deploy to Xiaoheihe

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'index.html'
      - 'vite.config.js'
      - 'assets/**'
      - '.github/workflows/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Inject Heybox login session
        run: |
          mkdir -p ~/.cache/hb-sdk
          printf '%s' "${{ secrets.HEYBOX_AUTH_JSON }}" > ~/.cache/hb-sdk/auth.json
          chmod 600 ~/.cache/hb-sdk/auth.json

      - name: Bump patch version
        run: |
          node -e "const p=require('./package.json');const [m,mi,pa]=p.version.split('.').map(Number);p.version=m+'.'+mi+'.'+(pa+1);require('fs').writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');console.log('Deploy version:',p.version)"

      - name: Build
        run: npm run build

      - name: Deploy (submit for review)
        run: npx hb-sdk remote deploy --release-note "auto: ${{ github.event.head_commit.message }}"
