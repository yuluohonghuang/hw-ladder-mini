# Auto deploy workflow: push to main → build → submit to Xiaoheihe for review
name: Auto Deploy to Xiaoheihe

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'index.html'
      - 'vite.config.js'
      - 'assets/**'
      - '.github/workflows/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate data quality
        run: node scripts/validate-data.mjs

      - name: Inject Heybox login session
        run: |
          mkdir -p ~/.cache/hb-sdk
          printf '%s' '${{ secrets.HEYBOX_AUTH_JSON }}' > ~/.cache/hb-sdk/auth.json
          chmod 600 ~/.cache/hb-sdk/auth.json
          echo "auth.json size: $(wc -c < ~/.cache/hb-sdk/auth.json)"

      - name: Bump patch version
        run: |
          # 1. 查远端版本列表
          echo "=== 查远端版本号 ==="
          REMOTE_VERSIONS=$(npx hb-sdk remote versions 2>&1 || echo "")
          echo "$REMOTE_VERSIONS"
          
          # 2. 提取所有版本号（只从 INFO 行提取，避免匹配到 WARN 里的 hb-sdk 版本号）
          LATEST=$(echo "$REMOTE_VERSIONS" | grep '^\[hb-sdk\] INFO' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1)
          echo "远端最新版本: $LATEST"
          
          # 3. 找有没有 auditing / pending 状态的版本（只从 INFO 行找）
          AUDITING=$(echo "$REMOTE_VERSIONS" | grep '^\[hb-sdk\] INFO' | grep -E 'auditing|pending' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          
          if [ -n "$AUDITING" ]; then
            echo "检测到审核中版本: $AUDITING，先撤回..."
            npx hb-sdk remote withdraw "$AUDITING" --yes
          fi
          
          # 4. 计算新版本号（最新版本号 +1）
          if [ -n "$LATEST" ]; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
            NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          else
            # 兜底：本地版本号 +1
            NEW_VERSION=$(node -e "const p=require('./package.json');const [m,mi,pa]=p.version.split('.').map(Number);console.log(m+'.'+mi+'.'+(pa+1))")
          fi
          
          # 5. 写入新版本号
          node -e "const p=require('./package.json');p.version='$NEW_VERSION';require('fs').writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');console.log('Deploy version:',p.version)"

      - name: Build
        run: npm run build

      - name: Deploy (submit for review)
        run: 'npx hb-sdk remote deploy --release-note "auto: ${{ github.event.head_commit.message }}"'
